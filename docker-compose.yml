# Local PostgreSQL for game-development (port 5433 avoids conflict with system Postgres on 5432)
services:
  postgres:
    image: postgres:16-alpine
    container_name: games-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: games_db
    ports:
      - "5433:5432"
    volumes:
      - games_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d games_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  games_pg_data:
